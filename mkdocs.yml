site_name: Secchi
site_description: Open source package intelligence from your terminal
site_url: https://docs.secchi.dev/
repo_url: https://github.com/kannandreams/secchi
repo_name: kannandreams/secchi

theme:
  name: material
  custom_dir: overrides
  language: en
  favicon: assets/favicon.svg
  # Fonts are self-hosted (docs/fonts, declared in extra.css); no Google Fonts.
  font: false
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  # Colors come entirely from stylesheets/extra.css (the secchi.dev tokens).
  # Dark first; the header bar stays dark in both schemes.
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

extra:
  # The wordmark links to the product site, as on secchi.dev; "Docs" and
  # the sidebar "Home" entry lead back here.
  homepage: https://secchi.dev/

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Commands: commands.md
  - Dashboard metrics: metrics.md
  - Workspace: workspace.md
  - Reports: reports.md
  - Environment variables: environment.md
  - GitHub Actions: github-actions.md
  - MCP and agents: mcp.md
  - Development: development.md
  - Contributing: contributing.md
