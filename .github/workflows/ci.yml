name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # "code" = anything that isn't docs-site-only. Keep this in sync
          # with the equivalent filter in security.yml.
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!mkdocs.yml'
              - '!overrides/**'
              - '!README.md'

  checks:
    name: Python ${{ matrix.python-version }}
    needs: changes
    # Skip the full Python matrix for docs-site-only changes; a manual
    # workflow_dispatch always runs it.
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Test
        run: uv run pytest --cov=secchi --cov-report=xml --cov-report=html --cov-report=term-missing

      - name: Add coverage summary
        if: ${{ matrix.python-version == '3.12' }}
        run: |
          {
            echo "## Test coverage"
            echo
            echo '```text'
            uv run coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: ${{ matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-3.12
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error
          retention-days: 30

      - name: Build verification
        run: uv build

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Build MkDocs site
        run: uv run mkdocs build --strict

  ci-required:
    name: CI Required
    needs:
      - changes
      - checks
      - docs
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Verify CI results
        run: |
          echo "Docs-site-only change: ${{ needs.changes.outputs.code == 'false' }}"
          echo "Python matrix result: ${{ needs.checks.result }}"
          echo "Docs build result:     ${{ needs.docs.result }}"

          if [[ "${{ needs.docs.result }}" != "success" ]]; then
            echo "Documentation build failed."
            exit 1
          fi

          if [[ "${{ needs.changes.outputs.code }}" == "true" && "${{ needs.checks.result }}" != "success" ]]; then
            echo "Python matrix did not succeed."
            exit 1
          fi

          echo "All CI checks passed."
