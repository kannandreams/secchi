name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Test
        run: uv run pytest --cov=secchi --cov-report=xml --cov-report=html --cov-report=term-missing

      - name: Add coverage summary
        if: ${{ matrix.python-version == '3.12' }}
        run: |
          {
            echo "## Test coverage"
            echo
            echo '```text'
            uv run coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: ${{ matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-3.12
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error
          retention-days: 30

      - name: Build verification
        run: uv build

  ci-required:
    name: CI Required
    needs: 
      - checks
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Verify CI matrix
        run: |
          echo "CI matrix result: ${{ needs.checks.result }}"

          if [[ "${{ needs.checks.result }}" != "success" ]]; then
            echo "CI matrix did not succeed"
            exit 1
          fi

          echo "All CI checks passed."