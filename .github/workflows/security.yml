name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Export locked runtime dependencies
        run: uv export --locked --no-dev --no-emit-project --format requirements.txt --output-file /tmp/secchi-requirements.txt

      - name: Audit dependencies
        run: uvx --from pip-audit pip-audit -r /tmp/secchi-requirements.txt

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4

  security-required:
    name: Security Required
    needs:
      - codeql
      - dependency-audit
      - dependency-review

    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Verify security checks
        env:
          CODEQL_RESULT: ${{ needs.codeql.result }}
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          REVIEW_RESULT: ${{ needs.dependency-review.result }}
        run: |
          echo "CodeQL:            $CODEQL_RESULT"
          echo "Dependency audit:  $AUDIT_RESULT"
          echo "Dependency review: $REVIEW_RESULT"

          if [[ "$CODEQL_RESULT" != "success" ]]; then
            echo "CodeQL failed or did not complete successfully."
            exit 1
          fi

          if [[ "$AUDIT_RESULT" != "success" ]]; then
            echo "Dependency audit failed or did not complete successfully."
            exit 1
          fi

          if [[ "$REVIEW_RESULT" != "success" && "$REVIEW_RESULT" != "skipped" ]]; then
            echo "Dependency review failed."
            exit 1
          fi

          echo "All required security checks passed."