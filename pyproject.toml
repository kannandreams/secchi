[project]
name = "pkgwatch"
version = "0.1.0"
description = "Beautiful TUI dashboard to monitor packages across PyPI, crates.io, and npm"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "PkgWatch Contributors" },
]
dependencies = [
    "textual>=8.0",
    "textual-plotext>=1.0",
    "httpx>=0.27",
    "tomli-w>=1.0",
    "packaging>=24.0",
]

[project.scripts]
pkgwatch = "pkgwatch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pkgwatch"]
