[project]
name = "secchi"
dynamic = ["version"]
description = "Beautiful TUI dashboard to monitor packages across PyPI, crates.io, and npm"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Kannan Kalidasan" },
]
maintainers = [
    { name = "kannandreams" },
]
dependencies = [
    "textual>=8.0",
    "textual-plotext>=1.0",
    "httpx>=0.27",
    "tomli-w>=1.0",
    "packaging>=24.0",
]

[project.scripts]
secchi = "secchi.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/secchi"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "textual-dev>=1.8.0",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
